<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>昨日重现 · UI Showcase Demo v1.0</title>
  <link rel="stylesheet" href="./src/ui/typography/typography.css">
  <link rel="stylesheet" href="./src/styles/ui_motion.css">
  <link rel="stylesheet" href="./src/ui/styles/ui_materials.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: var(--text-chapter-font);
      background: #1d1009;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1d1009;
      touch-action: manipulation;
    }

    button { font: inherit; }

    .showcase {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 45%, #50311c, #170c07 75%);
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #2a180e;
      box-shadow: 0 18px 50px rgba(18, 8, 3, .58);
    }

    .scene-art {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .menu {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 34.03%;
      width: 33.594%;
      transform: translateX(-50%);
      display: grid;
      gap: 2px;
    }

    .asset-button {
      --sprite-top: 0%;
      position: relative;
      width: 100%;
      height: 65px;
      padding: 0;
      border: 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 5px rgba(45, 24, 11, .28));
      transition:
        transform 180ms cubic-bezier(.2, .72, .25, 1),
        filter 220ms ease,
        opacity 180ms ease;
    }

    .asset-button[data-sprite="start"] { height: 76px; --sprite-y: 0px; }
    .asset-button[data-sprite="continue"] { --sprite-y: -79px; }
    .asset-button[data-sprite="chapters"] { --sprite-y: -146px; }
    .asset-button[data-sprite="capsule"] { --sprite-y: -213px; }
    .asset-button[data-sprite="settings"] { --sprite-y: -280px; }

    .button-sprite {
      position: absolute;
      inset: 0;
      background: var(--ui-button-frame) center var(--sprite-y) / 430px auto no-repeat;
      pointer-events: none;
    }

    .asset-button::after {
      content: "";
      position: absolute;
      inset: 2px -8px;
      border: 2px solid transparent;
      pointer-events: none;
    }

    .asset-button[data-state="Touch Down"],
    .asset-button[data-state="Touch Hold"] {
      transform: translateY(4px) scale(.985);
      filter: brightness(.98) drop-shadow(0 2px 2px rgba(45, 24, 11, .22));
    }

    .asset-button[data-sprite="start"][data-state="Touch Down"],
    .asset-button[data-sprite="start"][data-state="Touch Hold"] {
      filter:
        brightness(1.13)
        saturate(1.08)
        drop-shadow(0 0 11px rgba(255, 190, 62, .72))
        drop-shadow(0 3px 3px rgba(45, 24, 11, .22));
    }

    .asset-button[data-state="Touch Release"] {
      transform: translateY(-2px) scale(1.018);
      filter:
        brightness(1.1)
        drop-shadow(0 0 8px rgba(238, 181, 75, .5))
        drop-shadow(0 7px 5px rgba(45, 24, 11, .26));
    }

    .asset-button[data-state="Selected"] {
      transform: translateX(5px);
      filter: brightness(1.035) drop-shadow(0 6px 6px rgba(45, 24, 11, .3));
    }

    .asset-button:disabled {
      opacity: .56;
      cursor: default;
      filter: grayscale(.42) brightness(.82) drop-shadow(0 3px 3px rgba(45, 24, 11, .18));
    }

    .debug-on .asset-button::after { border-color: rgba(220, 100, 72, .48); }

    .debug-toggle {
      position: absolute;
      z-index: 31;
      right: 20px;
      bottom: 24px;
      min-width: 104px;
      height: 34px;
      border: 1px solid rgba(87, 55, 29, .45);
      background: rgba(227, 205, 160, .78);
      color: #4e301d;
      font: 10px Consolas, monospace;
      letter-spacing: .08em;
    }

    .debug-toggle[aria-pressed="true"] {
      color: #f8e7bd;
      background: #6b3f1f;
    }

    .debug-panel {
      position: absolute;
      z-index: 30;
      right: 18px;
      top: 115px;
      width: 210px;
      color: #f7e7bd;
      background: rgba(31, 20, 14, .91);
      border: 1px solid rgba(211, 154, 56, .42);
      font: 11px Consolas, monospace;
      transform: translateX(calc(100% + 30px));
      transition: transform 260ms ease;
    }

    .debug-panel.visible { transform: translateX(0); }

    .debug-panel header {
      display: flex;
      justify-content: space-between;
      padding: 11px 12px;
      border-bottom: 1px solid rgba(211, 154, 56, .35);
    }

    .debug-panel header strong { color: #d7b268; }
    .debug-panel dl { margin: 0; padding: 6px 12px 10px; }
    .debug-panel dl div { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .debug-panel dt { color: #b79c6b; font-size: 9px; }
    .debug-panel dd { margin: 2px 0 0; overflow-wrap: anywhere; }

    .settings-sheet {
      position: absolute;
      z-index: 24;
      right: 26px;
      top: 200px;
      width: 270px;
      min-height: 260px;
      padding: 34px 30px;
      color: #56371f;
      background: #dfc58e;
      box-shadow: 0 17px 25px rgba(39, 22, 10, .34);
      opacity: 0;
      pointer-events: none;
      transform: translateX(120%) rotate(4deg);
      transition: transform 540ms cubic-bezier(.2,.72,.25,1), opacity 320ms ease;
    }

    .settings-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) rotate(1.2deg);
    }

    .settings-sheet h2 { margin: 8px 0 20px; font-size: 24px; }
    .setting-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(91,55,28,.2); }
    .settings-sheet button,
    .memory-copy button {
      margin-top: 24px;
      padding: 10px 20px;
      border: 1px solid rgba(96, 59, 29, .42);
      background: rgba(215, 189, 135, .82);
      color: #5d3c25;
    }

    .handoff {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1800px;
      visibility: hidden;
      pointer-events: none;
      background: transparent;
      transition: background 480ms ease;
    }

    .handoff.confirmed,
    .handoff.open {
      visibility: visible;
      background: rgba(35, 19, 9, .18);
    }

    .handoff.open { pointer-events: auto; }

    .archive-book {
      position: relative;
      width: 87.5%;
      height: 87.5%;
      transform-style: preserve-3d;
      background: var(--ui-book-page) center / 100% 100% no-repeat;
      opacity: 0;
      transform: translateY(18px) rotateX(5deg) scale(.94);
      filter: drop-shadow(0 24px 28px rgba(24, 12, 5, .38));
      transition: opacity 320ms ease, transform 760ms cubic-bezier(.18,.72,.26,1);
    }

    .handoff.confirmed .archive-book,
    .handoff.open .archive-book {
      opacity: 1;
      transform: translateY(0) rotateX(0) scale(1);
    }

    .book-depth {
      position: absolute;
      z-index: -1;
      left: 4.65%;
      right: 4.2%;
      bottom: 4%;
      height: 22px;
      border-radius: 0 0 18px 18px;
      background: repeating-linear-gradient(180deg,#7d5a34 0 2px,#d5b77d 2px 4px,#80603b 4px 5px);
      box-shadow: 0 12px 18px rgba(31,16,8,.42);
      transform: translateZ(-12px);
    }

    .turning-leaf {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 6.35%;
      width: 45.7%;
      height: 87%;
      transform-origin: 0 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .handoff.confirmed .turning-leaf,
    .handoff.open .turning-leaf {
      animation: page-turn 1.65s cubic-bezier(.35,.02,.18,1) 180ms forwards;
    }

    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 2px 26px 22px 3px;
      background-image: var(--ui-book-page);
      background-size: 218.75% 115%;
      background-repeat: no-repeat;
    }

    .leaf-front {
      background-position: right top;
      box-shadow: inset 18px 0 24px rgba(105,70,34,.13), inset -7px 0 5px rgba(72,44,21,.18), 10px 8px 18px rgba(45,26,12,.2);
    }

    .leaf-back {
      transform: rotateY(180deg);
      border-radius: 26px 2px 3px 22px;
      background-position: left top;
      filter: brightness(.93) sepia(.08);
      box-shadow: inset -24px 0 30px rgba(89,57,27,.18), inset 6px 0 4px rgba(255,235,186,.18);
    }

    .leaf-thickness {
      position: absolute;
      right: -3px;
      top: 6px;
      bottom: 7px;
      width: 5px;
      transform: rotateY(90deg);
      transform-origin: left center;
      background: repeating-linear-gradient(180deg,#f1dba7 0 2px,#9d7847 2px 3px);
    }

    .spine-shadow {
      position: absolute;
      z-index: 12;
      left: calc(50% - 15px);
      top: 6%;
      bottom: 6%;
      width: 30px;
      background: linear-gradient(90deg,transparent,rgba(62,35,16,.28) 44%,rgba(255,232,181,.12) 56%,transparent);
      filter: blur(2px);
      pointer-events: none;
    }

    .revealed-memory {
      position: absolute;
      z-index: 4;
      inset: 10.8% 6.8% 9.5% 7%;
      display: grid;
      grid-template-columns: 44% 56%;
      align-items: center;
      opacity: 0;
    }

    .handoff.open .revealed-memory { opacity: 1; }

    .memory-photo {
      position: relative;
      justify-self: center;
      width: 330px;
      height: 390px;
      border: 15px solid #efe1b8;
      border-bottom-width: 48px;
      background:
        linear-gradient(rgba(87,60,34,.12),rgba(44,29,17,.2)),
        var(--ui-main-background) 85% 68% / 320% auto no-repeat;
      box-shadow: 0 18px 24px rgba(54,31,15,.28);
      opacity: 0;
      transform: translateY(12px) rotate(-3deg) scale(.96);
    }

    .handoff.open .memory-photo { animation: photo-develop 720ms ease-out 120ms forwards; }

    .photo-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -37px;
      text-align: center;
      color: #765232;
      font-size: 18px;
      letter-spacing: .12em;
    }

    .memory-copy {
      padding: 0 38px 0 44px;
      color: #57351f;
      opacity: 0;
      transform: translateY(10px);
    }

    .handoff.open .memory-copy { animation: writing-reveal 680ms ease-out 380ms forwards; }
    .memory-copy small { color: #9b4e2e; font-family: var(--text-system-font); letter-spacing: .18em; }
    .memory-copy h2 { margin: 22px 0 16px; font-size: 35px; letter-spacing: .12em; }
    .memory-copy p { margin: 0; color: #77573a; font-size: 20px; line-height: 1.8; }

    .book-dust {
      position: absolute;
      z-index: 20;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .book-dust i {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: rgba(255,230,168,.72);
      box-shadow: 0 0 5px rgba(255,217,132,.6);
      opacity: 0;
    }

    .handoff.confirmed .book-dust i,
    .handoff.open .book-dust i {
      animation: dust-rise 1.8s ease-out calc(240ms + var(--i) * 55ms) both;
    }

    .orientation {
      display: none;
      position: fixed;
      z-index: 100;
      inset: 0;
      place-items: center;
      text-align: center;
      color: #f4ddb0;
      background: #25140b;
    }

    @keyframes page-turn {
      0% { transform: rotateY(0) skewY(0); }
      28% { transform: rotateY(-38deg) skewY(-1.2deg); }
      52% { transform: rotateY(-94deg) skewY(1.8deg) scaleX(.96); }
      76% { transform: rotateY(-151deg) skewY(-.6deg); }
      100% { transform: rotateY(-179deg) skewY(0); }
    }

    @keyframes photo-develop {
      0% { opacity: 0; filter: sepia(1) contrast(.72) brightness(1.18); transform: translateY(12px) rotate(-3deg) scale(.96); }
      55% { opacity: .72; filter: sepia(.72) contrast(.86) brightness(1.06); }
      100% { opacity: 1; filter: sepia(.2) contrast(.94) brightness(.98); transform: translateY(0) rotate(-3deg) scale(1); }
    }

    @keyframes writing-reveal {
      from { opacity: 0; filter: blur(2px); transform: translateY(10px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    @keyframes dust-rise {
      0% { opacity: 0; transform: translate3d(0,14px,0) scale(.6); }
      28% { opacity: .7; }
      100% { opacity: 0; transform: translate3d(var(--drift),-72px,0) scale(1.25); }
    }

    @media (orientation: portrait) {
      .orientation { display: grid; }
    }

    @media (max-height: 560px) {
      .asset-button { height: 9.03vh; }
      .asset-button[data-sprite="start"] { height: 10.55vh; }
      .button-sprite { background-size: 59.72vh auto; }
      .asset-button[data-sprite="continue"] { --sprite-y: -10.97vh; }
      .asset-button[data-sprite="chapters"] { --sprite-y: -20.28vh; }
      .asset-button[data-sprite="capsule"] { --sprite-y: -29.58vh; }
      .asset-button[data-sprite="settings"] { --sprite-y: -38.89vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="showcase">
    <section class="stage" id="stage" aria-label="昨日重现主菜单">
      <img class="scene-art" data-ui-asset="mainMenuBackground" alt="" draggable="false">

      <nav class="menu" aria-label="主菜单">
        <button class="asset-button" id="BTN_START_MEMORY" data-sprite="start" data-state="Selected" aria-label="开始回忆" aria-pressed="true">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_CONTINUE" data-sprite="continue" data-state="Disabled" aria-label="继续昨日" disabled>
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_CHAPTERS" data-sprite="chapters" data-state="Idle" aria-label="章节选择">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_CAPSULE" data-sprite="capsule" data-state="Idle" aria-label="时间胶囊">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_SETTINGS" data-sprite="settings" data-state="Idle" aria-label="设置">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
      </nav>

      <button class="debug-toggle" id="debugToggle" aria-pressed="false">DEBUG OFF</button>

      <aside class="debug-panel" id="debugPanel">
        <header><span>INTERACTION DEBUG</span><strong>1280×720 LP</strong></header>
        <dl>
          <div><dt>Element ID</dt><dd id="debugId">BTN_START_MEMORY</dd></div>
          <div><dt>Current State</dt><dd id="debugState">Selected</dd></div>
          <div><dt>Motion ID</dt><dd id="debugMotion">MOTION_DORMANT_MEMORY</dd></div>
          <div><dt>Touch Target</dt><dd id="debugTarget">#BTN_START_MEMORY</dd></div>
        </dl>
      </aside>

      <aside class="settings-sheet" id="settingsSheet" aria-hidden="true">
        <small>附页 · 设置验证</small>
        <h2>旧档案的声音</h2>
        <div class="setting-line"><span>环境旧唱片</span><strong>开启</strong></div>
        <div class="setting-line"><span>触感反馈</span><strong>柔和</strong></div>
        <button type="button" id="closeSettings">收回附页</button>
      </aside>

      <section class="handoff" id="handoff" aria-hidden="true">
        <div class="archive-book">
          <div class="book-depth" aria-hidden="true"></div>
          <div class="revealed-memory">
            <div class="memory-photo">
              <span class="photo-caption">一九九八年 · 夏</span>
            </div>
            <div class="memory-copy">
              <small>MEMORY CONFIRMED</small>
              <h2>第一章 · 儿时的回忆</h2>
              <p>有些记忆褪了色，却从未真正离开。</p>
              <button type="button" id="closeBook">合上相册，返回昨日</button>
            </div>
          </div>
          <div class="turning-leaf" aria-hidden="true">
            <div class="leaf-face leaf-front"></div>
            <div class="leaf-face leaf-back"></div>
            <i class="leaf-thickness"></i>
          </div>
          <div class="spine-shadow" aria-hidden="true"></div>
          <div class="book-dust" id="bookDust" aria-hidden="true"></div>
        </div>
      </section>
    </section>

    <div class="orientation">
      <div><strong>请横握手机</strong><br><small>本Demo固定为16:9横屏画布</small></div>
    </div>
  </main>

  <script type="text/plain" id="legacy-phase3">
    (() => {
      const stage = document.getElementById("stage");
      const buttons = [...document.querySelectorAll(".asset-button")];
      const debugToggle = document.getElementById("debugToggle");
      const debugPanel = document.getElementById("debugPanel");
      const settingsSheet = document.getElementById("settingsSheet");
      const handoff = document.getElementById("handoff");
      const bookDust = document.getElementById("bookDust");
      const selected = { id: "BTN_START_MEMORY" };
      const active = new Map();

      const debug = {
        id: document.getElementById("debugId"),
        state: document.getElementById("debugState"),
        motion: document.getElementById("debugMotion"),
        target: document.getElementById("debugTarget"),
      };

      const motionFor = (button, state) => {
        if (button.id === "BTN_START_MEMORY") {
          if (state === "Touch Down") return "MOTION_MEMORY_AWAKEN";
          if (state === "Touch Hold") return "MOTION_AWAKENING_HOLD";
          if (state === "Touch Release") return "MOTION_MEMORY_CONFIRMED";
          return "MOTION_DORMANT_MEMORY";
        }
        if (state === "Touch Down") return "MOTION_BUTTON_PRESS";
        if (state === "Touch Hold") return "MOTION_BUTTON_HOLD";
        if (state === "Touch Release") return "MOTION_BUTTON_RELEASE";
        return "MOTION_BUTTON_IDLE";
      };

      const report = (button, state) => {
        button.dataset.state = state;
        debug.id.textContent = button.id;
        debug.state.textContent = state;
        debug.motion.textContent = motionFor(button, state);
        debug.target.textContent = `#${button.id}`;
      };

      const settle = (button) => {
        report(button, selected.id === button.id ? "Selected" : "Idle");
        button.setAttribute("aria-pressed", String(selected.id === button.id));
      };

      const choose = (button) => {
        selected.id = button.id;
        buttons.forEach(settle);
      };

      const openBook = () => {
        handoff.className = "handoff confirmed";
        handoff.setAttribute("aria-hidden", "false");
        window.setTimeout(() => {
          handoff.className = "handoff open";
        }, 1900);
      };

      buttons.forEach((button) => {
        if (button.disabled) return;

        button.addEventListener("pointerdown", (event) => {
          if (active.has(button)) return;
          button.setPointerCapture(event.pointerId);
          report(button, "Touch Down");
          const timer = window.setTimeout(() => report(button, "Touch Hold"), 360);
          active.set(button, { pointerId: event.pointerId, timer });
        });

        button.addEventListener("pointerup", (event) => {
          const current = active.get(button);
          if (!current || current.pointerId !== event.pointerId) return;
          window.clearTimeout(current.timer);
          active.delete(button);
          const bounds = button.getBoundingClientRect();
          const valid =
            event.clientX >= bounds.left - 12 &&
            event.clientX <= bounds.right + 12 &&
            event.clientY >= bounds.top - 8 &&
            event.clientY <= bounds.bottom + 8;
          if (!valid) return settle(button);
          report(button, "Touch Release");
          window.setTimeout(() => {
            choose(button);
            if (button.id === "BTN_START_MEMORY") openBook();
            if (button.id === "BTN_SETTINGS") {
              const open = !settingsSheet.classList.contains("open");
              settingsSheet.classList.toggle("open", open);
              settingsSheet.setAttribute("aria-hidden", String(!open));
            }
          }, button.id === "BTN_START_MEMORY" ? 520 : 180);
        });

        button.addEventListener("pointercancel", () => {
          const current = active.get(button);
          if (current) window.clearTimeout(current.timer);
          active.delete(button);
          settle(button);
        });
      });

      debugToggle.addEventListener("click", () => {
        const enabled = !stage.classList.contains("debug-on");
        stage.classList.toggle("debug-on", enabled);
        debugPanel.classList.toggle("visible", enabled);
        debugToggle.textContent = enabled ? "DEBUG ON" : "DEBUG OFF";
        debugToggle.setAttribute("aria-pressed", String(enabled));
      });

      document.getElementById("closeSettings").addEventListener("click", () => {
        settingsSheet.classList.remove("open");
        settingsSheet.setAttribute("aria-hidden", "true");
      });

      document.getElementById("closeBook").addEventListener("click", () => {
        handoff.className = "handoff";
        handoff.setAttribute("aria-hidden", "true");
        choose(document.getElementById("BTN_START_MEMORY"));
      });

      for (let index = 0; index < 12; index += 1) {
        const dust = document.createElement("i");
        dust.style.setProperty("--i", index);
        dust.style.setProperty("--x", `${18 + index * 5.5}%`);
        dust.style.setProperty("--y", `${44 + (index % 4) * 6}%`);
        dust.style.setProperty("--size", `${2 + (index % 3)}px`);
        dust.style.setProperty("--drift", `${(index - 6) * 5}px`);
        bookDust.appendChild(dust);
      }
    })();
  </script>
  <script type="module" src="./src/phase4.js"></script>
  <script type="module" src="./src/phase5.js"></script>
</body>
</html>
